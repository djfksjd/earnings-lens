# 로컬 전용 설정. 주소는 http://127.0.0.1:8765 로 고정된다.
[server]
address = "127.0.0.1"          # 내 컴퓨터에서만 접속 가능 (0.0.0.0으로 바꾸지 마세요)
port = 8765
headless = false               # 실행하면 브라우저가 자동으로 열린다
enableStaticServing = true     # static/ 폴더(웹폰트) 제공
enableXsrfProtection = true
enableCORS = true
runOnSave = false
maxUploadSize = 20

[browser]
gatherUsageStats = false       # 사용 통계 전송 끔
serverAddress = "127.0.0.1"
serverPort = 8765

[client]
toolbarMode = "minimal"
showErrorDetails = "type"      # 화면에 스택트레이스(경로 등)를 노출하지 않는다
showSidebarNavigation = false

[runner]
magicEnabled = false

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#4C63F0"
backgroundColor = "#F3F4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12141A"
font = "Pretendard, system-ui, -apple-system, sans-serif"
baseRadius = "12px"
borderColor = "rgba(18,20,26,0.12)"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "45 920"
style = "normal"
